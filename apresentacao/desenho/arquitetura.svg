<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0F2547"/></marker>
    <marker id="so" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#D6541F"/></marker>
    <style>
      .cx{fill:#fff;stroke:#0F2547;stroke-width:2.5}
      .cq{fill:#fff;stroke:#D6541F;stroke-width:2.5;stroke-dasharray:6 5}
      .slab{fill:rgba(15,37,71,.045);stroke:rgba(15,37,71,.28);stroke-width:2;stroke-dasharray:7 5}
      .tt{font-size:17px;fill:#0F2547;font-weight:600}
      .tp{font-size:13px;fill:rgba(15,37,71,.62);letter-spacing:.09em}
      .ts{font-size:14px;fill:#D6541F;letter-spacing:.14em;font-weight:600}
      .to{font-size:13px;fill:#D6541F;letter-spacing:.09em}
      .tn{font-size:14px;fill:#1B7A55;font-weight:600}
      .tit{font-size:23px;fill:#0F2547;font-weight:700;letter-spacing:-.012em}
      .seta{stroke:#0F2547;stroke-width:2.5;fill:none;marker-end:url(#s)}
      .cano{stroke:#D6541F;stroke-width:3.5;fill:none;marker-end:url(#so)}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#F4F5F7"/>
  <text class="tit" x="40" y="44">Uma aula de engenharia de dados que cabe num laptop</text>
  <text class="tp" x="40" y="68">DOCKER COMPOSE &#160;&#183;&#160; CEAP DA C&#194;MARA DOS DEPUTADOS &#160;&#183;&#160; SEMUNI 2026</text>

  <!-- o palco -->
  <rect class="cx" x="40" y="104" width="250" height="74" rx="4"/>
  <text class="tt" x="58" y="134">notebook</text>
  <text class="tp" x="58" y="157">ONDE VOC&#202; PERGUNTA</text>
  <path class="seta" d="M165 178 V 222"/>

  <!-- o csv, na faixa livre da direita -->
  <rect class="cx" x="1010" y="104" width="170" height="86" rx="4"/>
  <text class="tt" x="1026" y="134">Ano-2025</text>
  <text class="tt" x="1026" y="154">.csv</text>
  <text class="tp" x="1026" y="176">74,5 MB</text>
  <text class="tp" x="1010" y="216">ENTRA DIRETO</text>
  <text class="tp" x="1010" y="234">NO OBJECT</text>
  <text class="tp" x="1010" y="252">STORAGE</text>
  <path class="seta" d="M1170 190 V 560 H 996"/>

  <!-- processamento -->
  <rect class="slab" x="40" y="230" width="950" height="160" rx="6"/>
  <text class="ts" x="60" y="256">PROCESSAMENTO &#160;&#183;&#160; CONTAINERS spark</text>
  <rect class="cx" x="60" y="268" width="230" height="84" rx="4"/>
  <text class="tt" x="78" y="300">spark-master</text>
  <text class="tp" x="78" y="324">REPARTE O TRABALHO</text>
  <rect class="cx" x="310" y="268" width="190" height="84" rx="4"/>
  <text class="tt" x="328" y="300">worker 1</text>
  <text class="tp" x="328" y="324">2 CORES &#183; 2 GB</text>
  <rect class="cx" x="520" y="268" width="190" height="84" rx="4"/>
  <text class="tt" x="538" y="300">worker 2</text>
  <text class="tp" x="538" y="324">2 CORES &#183; 2 GB</text>
  <rect class="cq" x="730" y="268" width="230" height="84" rx="4"/>
  <text class="tt" x="748" y="300" fill="#D6541F">worker 3</text>
  <text class="tp" x="748" y="324" fill="#D6541F">SOBE AO VIVO</text>
  <text class="to" x="60" y="376">docker compose up -d --scale spark-worker=3 &#160;&#8212;&#160; mais m&#225;quina sem tocar no dado</text>

  <!-- o cano -->
  <path class="cano" d="M520 398 V 442"/>
  <path class="cano" d="M460 442 V 398"/>
  <text class="ts" x="556" y="414">s3a:// &#160;&#8212;&#160; A MESMA API DO AMAZON S3</text>
  <text class="tp" x="556" y="436">TROCA O ENDPOINT NA CONFIGURA&#199;&#195;O E O MESMO C&#211;DIGO RODA NA AWS</text>

  <!-- armazenamento -->
  <rect class="slab" x="40" y="456" width="950" height="180" rx="6"/>
  <text class="ts" x="60" y="482">ARMAZENAMENTO &#160;&#183;&#160; CONTAINER minio</text>
  <rect class="cx" x="60" y="494" width="230" height="84" rx="4"/>
  <text class="tt" x="78" y="526">MinIO</text>
  <text class="tp" x="78" y="550">BUCKET lake</text>
  <rect class="cx" x="310" y="494" width="190" height="84" rx="4"/>
  <text class="tt" x="328" y="526">bronze</text>
  <text class="tp" x="328" y="550">209.066 LINHAS</text>
  <rect class="cx" x="520" y="494" width="190" height="84" rx="4"/>
  <text class="tt" x="538" y="526">silver</text>
  <text class="tp" x="538" y="550">DEFEITOS MARCADOS</text>
  <rect class="cx" x="730" y="494" width="230" height="84" rx="4"/>
  <text class="tt" x="748" y="526">gold</text>
  <text class="tp" x="748" y="550">19.441 EMPRESAS</text>
  <text class="tp" x="60" y="602">AS TR&#202;S S&#195;O TABELAS DELTA: PARQUET + UMA PASTA _delta_log COM O HIST&#211;RICO</text>
  <text class="tn" x="60" y="624">o Spark n&#227;o tem o dado. derrube os tr&#234;s containers dele e o lake continua inteiro.</text>

  <text class="tp" x="40" y="666">MINIO &#8594; AMAZON S3, GOOGLE CLOUD STORAGE, AZURE BLOB &#160;&#183;&#160; SPARK &#8594; EMR, DATAPROC, DATABRICKS</text>
  <text class="tn" x="40" y="688">o mesmo Apache Spark e o mesmo Delta Lake rodam na nuvem. o que muda &#233; quem opera a infraestrutura.</text>
</svg>
