# Configuracao do pipeline da cota parlamentar.
# Endpoint e credenciais podem ser sobrescritos por variavel de ambiente
# (S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY).

fonte:
  # O portal da Camara publica um zip por ano.
  url_template: "https://www.camara.leg.br/cotas/Ano-{ano}.csv.zip"
  anos: [2019, 2020, 2021, 2022, 2023, 2024, 2025]

armazenamento:
  endpoint: "http://minio:9000"
  access_key: "semuni"
  secret_key: "semuni2026"
  bucket: "lake"
  prefixos:
    landing: "landing"
    bronze: "bronze"
    silver: "silver"
    gold: "gold"

spark:
  # O cluster fica no docker-compose. Aqui so o que o job precisa saber.
  master: "spark://spark-master:7077"
  shuffle_partitions: 8
